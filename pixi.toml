# Runs the benchmark with a pinned omnibenchmark. Assumes apptainer on the host.
[workspace]
name = "pipelines-plan"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.14.*"

[pypi-dependencies]
omnibenchmark = "==0.8.0"

[tasks]
validate = "ob validate plan benchmark.yaml"
dry = "ob run benchmark.yaml --dry"
run = "ob run benchmark.yaml"
