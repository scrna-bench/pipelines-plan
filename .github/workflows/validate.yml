name: Validate Benchmark

on:
  pull_request:
    paths:
      - benchmark.yaml
      - pixi.toml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.11.3

      - name: Validate benchmark.yaml
        run: |
          pixi run validate

